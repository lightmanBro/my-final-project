<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d1117" />
  <circle cx="50" cy="50" r="42" stroke="url(#glowGrad)" stroke-width="2" opacity="0.4" />
  <g filter="url(#neonGlow)">
    <circle cx="36" cy="65" r="10" fill="url(#glowGrad)" />
    <circle cx="66" cy="55" r="10" fill="url(#glowGrad)" />
    <rect x="42" y="24" width="4" height="41" fill="url(#glowGrad)" />
    <rect x="72" y="14" width="4" height="41" fill="url(#glowGrad)" />
    <polygon points="42,24 76,14 76,22 42,32" fill="url(#glowGrad)" />
  </g>
</svg>
